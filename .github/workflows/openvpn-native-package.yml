name: Package OpenVPN-enabled debug APK

on:
  workflow_run:
    workflows: ["OpenVPN native Android build"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  package-debug:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'integration/mlmvpn-foundation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact native-build revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download both ABI libraries from the successful native run
        uses: actions/download-artifact@v4
        with:
          pattern: mleopenvpn-*
          path: native-artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify and stage native libraries
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            source="native-artifacts/mleopenvpn-${abi}/libmleopenvpn.so"
            test -s "$source"
            mkdir -p "app/src/main/jniLibs/$abi"
            install -m 0644 "$source" "app/src/main/jniLibs/$abi/libmleopenvpn.so"
          done
          find app/src/main/jniLibs -name libmleopenvpn.so -type f -print

      - name: Assemble APK with both OpenVPN ABIs
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify both native libraries are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libmleopenvpn\.so'
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libmleopenvpn\.so'
          unzip -l "$apk" | grep -q 'lib/armeabi-v7a/libmleopenvpn\.so'

      - name: Upload OpenVPN-enabled debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mle-vpn-openvpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
