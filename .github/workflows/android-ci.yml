name: Android CI

on:
  push:
    branches: [ main, "feature/**" ]
  # PR #4 targets another feature branch while the integration work is staged.
  # Include feature/** so the same build and unit-test gates run for that PR.
  pull_request:
    branches: [ main, "feature/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install AmneziaWG native build toolchain
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MLE-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Run JVM and Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install AmneziaWG native build toolchain
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Run unit tests with diagnostic output
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Upload test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MLE-VPN-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
